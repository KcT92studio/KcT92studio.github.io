<!doctype html>
<html lang="lo"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ຄະແນນຂອງຂ້ອຍ</title></head>
<body><div class="wrap">
<h1>ຄະແນນຂອງຂ້ອຍ</h1>
<div class="mut" id="bar"></div>
<div id="gate"></div>
<div id="main" hidden>
  <div class="row"><button id="bMe">👤 ຂໍ້ມູນຂອງຂ້ອຍ</button><button id="bMiss" class="warn">⚠️ ຄະແນນບໍ່ໄດ້ເສັງ</button></div>
  <h2>ເລືອກເດືອນ</h2><div class="chips" id="chips"></div>
  <div id="panel"></div>
  <div class="mut" id="who" style="margin:6px 0"></div>
  <div class="tw" id="tw"></div>
  <button id="fs" class="fsb" hidden>⛶ ເຕັມຈໍ</button>
</div></div>
<script src="portal.js"></script>
<script>
const CK = () => "kct:c:" + (jwt(TOK).email || ""); let wired = false;
let D, month, view = "";            // view: "" | "me" | "miss"

window.onApiRetry = n => { const w = $("#wait"); if (w) w.textContent = "⏳ ເຊີບເວີກຳລັງຕື່ນ… ລອງເຊື່ອມຕໍ່ອີກຄັ້ງ (" + (n + 1) + "/3)"; };
needLogin($("#gate"), boot);
async function boot() {
  $("#bar").innerHTML = userBar();
  try {
    const c = localStorage.getItem(CK());                        // ສະແດງຂໍ້ມູນເກົ່າທັນທີ ແລ້ວອັບເດດຫຼັງ
    if (c && !D) { try { start(JSON.parse(c)); } catch (e) {} }
    if (!D && !c) gate('<p id="wait">⏳ ກຳລັງເຊື່ອມຕໍ່ເຊີບເວີ… ເຂົ້າຄັ້ງທຳອິດອາດໃຊ້ເວລາຈັກໜ້ອຍ</p>');
    const pc = (!D && !c) ? loadClasses().catch(() => null) : null;   // ໂຫຼດລາຍຊື່ຫ້ອງຂະໜານກັນ ບໍ່ລໍຖ້າຕໍ່ກັນ
    const s = await api({ a: "open" });
    if (s.status === "ອະນຸມັດ" && s.months) { localStorage.setItem(CK(), JSON.stringify(s)); return start(s); }
    localStorage.removeItem(CK()); D = null;
    if (s.status === "none") return form();
    gate(s.status === "ປະຕິເສດ"
      ? `<p class="err">ຄຳຂໍຂອງ ${esc(s.name)} (${esc(s.cls)}) ບໍ່ຖືກອະນຸມັດ. ກະລຸນາຕິດຕໍ່ຄູ.</p><button id="again">ຂໍໃໝ່</button>`
      : `<p>⏳ ກຳລັງລໍຖ້າຄູອະນຸມັດ: <b>${esc(s.name)}</b> (${esc(s.cls)})</p><div class="row"><button class="pri" id="re">ກວດສະຖານະ</button><button id="again">ປ່ຽນຊື່/ຫ້ອງ</button></div>`);
    if ($("#re")) $("#re").onclick = boot;
    if ($("#again")) $("#again").onclick = form;
  } catch (e) { if (e.auth) return location.reload(); if (D) return; gate(`<p class="err">${esc(e.message)}</p><button id="re">ລອງໃໝ່</button>`); $("#re").onclick = boot; }
}
function gate(h) { $("#main").hidden = true; $("#gate").hidden = false; $("#gate").innerHTML = `<div class="card">${h}</div>`; }
async function form() {
  let classes = CLS;
  if (!classes) {
    gate("ກຳລັງໂຫຼດ…");
    try { classes = await loadClasses(); } catch (e) { gate(`<p class="err">${esc(e.message)}</p><button id="re">ລອງໃໝ່</button>`); $("#re").onclick = form; return; }
  } else loadClasses().catch(() => {});                                // ມີຂໍ້ມູນເກົ່າ → ສະແດງທັນທີ ແລ້ວອັບເດດຫຼັງ
  gate(`<h2>ຂໍສິດເບິ່ງຄະແນນ</h2><label>ຫ້ອງ</label><select id="c"><option value="">— ເລືອກຫ້ອງ —</option>${classes.map(c => `<option>${esc(c)}</option>`).join("")}</select>
    <label>ຊື່ ແລະ ນາມສະກຸນຂອງຂ້ອຍ</label><input id="n" maxlength="80" placeholder="ພິມໃຫ້ຖືກຕາມລາຍຊື່ຫ້ອງ" autocomplete="off">
    <p class="mut">ຄູຈະກວດ ແລະ ອະນຸມັດ (ຜູກກັບ Gmail ນີ້). ອະນຸມັດແລ້ວຈະເຫັນຄະແນນຂອງຫ້ອງຕົນເອງເທົ່ານັ້ນ.</p>
    <button class="pri" id="go" disabled>ສົ່ງຄຳຂໍ</button><div class="err" id="e"></div>`);
  const ok = () => $("#go").disabled = !($("#c").value && $("#n").value.trim());
  $("#c").onchange = ok; $("#n").oninput = ok;
  $("#go").onclick = async () => {
    try { await api({ a: "request", cls: $("#c").value, name: $("#n").value }); boot(); } catch (e) { $("#e").textContent = e.message; }
  };
}
function start(d) {
  D = d; $("#gate").hidden = true; $("#main").hidden = false; $("#fs").hidden = false;
  if (!D.months[month]) month = Object.keys(D.months)[0];
  $("#who").textContent = `${D.cls} · ${D.names[D.me] || ""}`;
  if (!wired) {
    wired = true;
    $("#bMe").onclick = () => { view = view === "me" ? "" : "me"; draw(); };
    $("#bMiss").onclick = () => { view = view === "miss" ? "" : "miss"; draw(); };
    fullscreen($("#tw"), $("#fs"));
  }
  draw();
}
function draw() {
  const ms = Object.keys(D.months), rows = D.months[month], me = D.me, mine = rows[me] || [];
  chips($("#chips"), ms, month, m => { month = m; draw(); });
  $("#bMe").classList.toggle("on", view === "me"); $("#bMiss").classList.toggle("on", view === "miss");
  let p = "";
  if (view === "me") {
    const st = stats(mine);
    p = `<div class="card"><b>${esc(D.names[me])}</b> · ${esc(month)}` + D.subjects.map((s, i) =>
      `<div class="sc"><span>${esc(s)}</span>${mine[i] == null ? '<b class="m">ບໍ່ໄດ້ເສັງ</b>' : `<b${mine[i] < 5 ? ' class="m"' : ""}>${fmt(mine[i])}</b>`}</div>`).join("") +
      `<div class="sc"><span>SUM</span><b>${fmt(st.sum)}</b></div><div class="sc"><span>AVER</span><b>${st.avg == null ? "" : st.avg.toFixed(2)}</b></div></div>`;
  } else if (view === "miss") {
    const mi = D.subjects.filter((_, i) => mine[i] == null);
    p = `<div class="card"><b>ວິຊາທີ່ຂ້ອຍບໍ່ໄດ້ເສັງ · ${esc(month)}</b><br>` +
      (mi.length ? mi.map(s => `<span class="pill">${esc(s)}</span>`).join("") : '<span style="color:var(--ok);font-weight:700">✓ ເສັງຄົບທຸກວິຊາ</span>') +
      '<div class="mut" style="margin-top:8px">ຕາຕະລາງລຸ່ມ: ຊ່ອງສີບົວ = ບໍ່ໄດ້ເສັງ, ແຖວລຸ່ມສຸດ = ຈຳນວນຄົນທີ່ຂາດແຕ່ລະວິຊາ</div></div>';
  }
  $("#panel").innerHTML = p;
  $("#tw").innerHTML = table(D, rows, { me, miss: view === "miss" });
}
</script></body></html>
